<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Don Quixote — Aprende español</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1410;
      color: #f5e9d0;
      font-family: Verdana, Tahoma, Arial, 'Segoe UI', sans-serif;
      line-height: 1.5;
      letter-spacing: 0.01em;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app {
      position: relative;
      width: min(960px, 100vw);
      aspect-ratio: 3 / 2;
    }
    #app canvas { display: block; border-radius: 6px; }
    .hidden { display: none !important; }

    /* HUD bar over the canvas */
    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 12px;
      background: rgba(20, 14, 8, 0.75);
      border: 1px solid #7a5a2b;
      border-radius: 6px;
      font-size: 15px;
      line-height: 1.4;
      pointer-events: none;
      z-index: 5;
    }
    #hud .objectives { color: #e8c86a; }

    /* Toast notifications */
    #toast {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      background: rgba(30, 60, 25, 0.92);
      border: 2px solid #7bc46a;
      border-radius: 8px;
      font-size: 16px;
      color: #eaffe0;
      z-index: 6;
      pointer-events: none;
      text-align: center;
    }

    /* Minigame overlay */
    #minigame-root {
      position: absolute;
      inset: 0;
      background: rgba(10, 8, 4, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .mg-card {
      width: min(640px, 94%);
      max-height: 88%;
      overflow-y: auto;
      background: #f5e9d0;
      color: #2b2013;
      border: 3px solid #7a5a2b;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    .mg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #7a5a2b;
      color: #f5e9d0;
      font-size: 18px;
    }
    .mg-close {
      background: none;
      border: none;
      color: #f5e9d0;
      font-size: 20px;
      cursor: pointer;
      font-family: inherit;
    }
    .mg-body { padding: 20px 24px; line-height: 1.5; }
    .mg-instructions { color: #6b573a; margin-bottom: 14px; font-size: 15px; }
    .mg-progress { font-size: 14px; color: #6b573a; margin-bottom: 10px; }
    .mg-prompt { font-size: 21px; margin-bottom: 16px; line-height: 1.4; }
    .mg-options { display: flex; flex-direction: column; gap: 8px; }
    .mg-option {
      padding: 10px 14px;
      font-size: 17px;
      font-family: inherit;
      background: #fff8ea;
      border: 2px solid #b99b6b;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .mg-option:hover:not(:disabled) { background: #f0e2c4; }
    .mg-option.correct { background: #cdeec2; border-color: #4f9d3f; }
    .mg-option.wrong { background: #f3c8c8; border-color: #b04040; }
    .mg-option:disabled { cursor: default; }
    .mg-input {
      font-size: 18px;
      font-family: inherit;
      padding: 8px 12px;
      border: 2px solid #b99b6b;
      border-radius: 6px;
      background: #fff8ea;
      width: 220px;
    }
    .mg-btn {
      padding: 10px 22px;
      font-size: 17px;
      font-family: inherit;
      background: #7a5a2b;
      color: #f5e9d0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
      margin-right: 8px;
    }
    .mg-btn:hover { background: #8f6c38; }
    .mg-option:focus-visible,
    .mg-btn:focus-visible,
    .mg-drag:focus-visible,
    .mg-input:focus-visible {
      outline: 3px solid #2b6cb0;
      outline-offset: 2px;
    }
    .mg-feedback { margin-top: 12px; font-size: 16px; min-height: 24px; font-weight: bold; }
    .mg-feedback.ok { color: #2e7d1f; }
    .mg-feedback.bad { color: #a33030; }
    .mg-translation { font-size: 15px; color: #6b573a; margin-top: 6px; }
    .mg-result { text-align: center; padding: 10px 0; }
    .mg-result h2 { font-size: 26px; margin-bottom: 10px; }
    .mg-result .score { font-size: 20px; margin-bottom: 8px; }

    /* Matching (drag & drop) */
    .mg-match { display: flex; gap: 30px; justify-content: center; }
    .mg-match-col { display: flex; flex-direction: column; gap: 10px; min-width: 200px; }
    .mg-drag {
      padding: 10px 14px;
      font-size: 17px;
      background: #fff8ea;
      border: 2px solid #b99b6b;
      border-radius: 6px;
      cursor: grab;
      text-align: center;
      user-select: none;
    }
    .mg-drag.matched { opacity: 0.35; cursor: default; }
    .mg-drop {
      padding: 10px 14px;
      font-size: 17px;
      background: #ece0c6;
      border: 2px dashed #b99b6b;
      border-radius: 6px;
      text-align: center;
      min-height: 44px;
    }
    .mg-drop.over { background: #f0e2c4; border-style: solid; }
    .mg-drop.matched { background: #cdeec2; border: 2px solid #4f9d3f; }
    .mg-drop.flash { background: #f3c8c8; border-color: #b04040; }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <div id="minigame-root" class="hidden"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
